name: CineRadarBot notify

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore sent items cache
        uses: actions/cache@v4
        with:
          path: data/sent_items.json
          key: cine-radar-sent-items-${{ github.run_id }}
          restore-keys: |
            cine-radar-sent-items-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
          STREAMING_API_PROVIDER: ${{ vars.STREAMING_API_PROVIDER || 'watchmode' }}
          COUNTRY: ${{ vars.COUNTRY || 'ES' }}
          LANGUAGE: ${{ vars.LANGUAGE || 'es-ES' }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '7' }}
          MIN_TMDB_VOTE_COUNT: ${{ vars.MIN_TMDB_VOTE_COUNT || '0' }}
          MAX_ITEMS_PER_MESSAGE: ${{ vars.MAX_ITEMS_PER_MESSAGE || '8' }}
          MAX_STREAMING_PAGES: ${{ vars.MAX_STREAMING_PAGES || '3' }}
          INCLUDE_SERIES: ${{ vars.INCLUDE_SERIES || 'true' }}
          STREAMING_CATALOGS: ${{ vars.STREAMING_CATALOGS || 'netflix,prime,disney,hbo,movistar,filmin,apple,skyshowtime' }}
          WATCHMODE_SOURCE_IDS: ${{ vars.WATCHMODE_SOURCE_IDS }}
        run: python -m src.main
